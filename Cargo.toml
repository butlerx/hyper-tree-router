[package]
name        = "hyper-tree-router"
version     = "0.2.0"
edition     = "2024"
description = "Prefix tree (trie) router for hyper 1.x and tower, usable standalone or inside axum."
keywords    = ["axum", "hyper", "router", "tower", "trie"]
authors     = ["butlerx <butlerx@notthe.cloud>"]
readme      = "README.md"
license     = "MIT"
repository  = "https://github.com/butlerx/hyper-tree-router"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
serde = ["dep:serde"]

[lib]
name = "hyper_tree_router"

[[example]]
name              = "typed_params"
required-features = ["serde"]

[dependencies]
http            = "1"
hyper           = "1"
prefix_tree_map = "0.2.1"
serde           = { version = "1", optional = true }
tower-service   = "0.3"

[dev-dependencies]
axum           = "0.8"
http-body-util = "0.1"
hyper          = { version = "1", features = ["http1", "server"] }
hyper-util     = { version = "0.1", features = ["tokio"] }
serde          = { version = "1", features = ["derive"] }
tokio          = { version = "1", features = ["full"] }
tower          = { version = "0.5", features = ["util"] }

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "deny"
