[package]
name        = "hyper-tree-router"
version     = "0.1.0"
edition     = "2021"
description = "Routing middleware for Hyper http library using Prefix tree (trie) for path finding."
keywords    = ["hyper", "prefix", "router", "tree", "trie"]
authors     = ["butlerx <butlerx@notthe.cloud>"]
readme      = "README.md"
license     = "MIT"
repository  = "https://github.com/butlerx/hyper-tree-router"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hyper_tree_router"

[dependencies]
hyper           = { version = "^0.14", features = ["http1", "server", "tcp"] }
prefix_tree_map = "0.2.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "deny"
